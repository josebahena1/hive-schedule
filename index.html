<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchday — League Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10151B;
    --turf: #7A5C00;
    --turf-light: #B8860B;
    --pitch: #FFD60A;
    --chalk: #F7F5F0;
    --chalk-dim: #E7E3D9;
    --score: #E8A33D;
    --line: rgba(16,21,27,0.10);
    --card-bg: #FFFFFF;
    --page-bg: var(--chalk);
    --text-primary: var(--ink);
    --text-secondary: rgba(16,21,27,0.62);
    --text-muted: rgba(16,21,27,0.42);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --page-bg: #0C0F12;
      --card-bg: #171C21;
      --line: rgba(247,245,240,0.10);
      --text-primary: #F2F1EC;
      --text-secondary: rgba(242,241,236,0.64);
      --text-muted: rgba(242,241,236,0.40);
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #0C0F12;
    --card-bg: #171C21;
    --line: rgba(247,245,240,0.10);
    --text-primary: #F2F1EC;
    --text-secondary: rgba(242,241,236,0.64);
    --text-muted: rgba(242,241,236,0.40);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, sans-serif;
  }
  body {
    padding-bottom: 4rem;
  }

  .condensed {
    font-family: 'Barlow Condensed', 'Inter', sans-serif;
  }

  header.masthead {
    background: var(--turf);
    color: var(--chalk);
    padding: 2.75rem 1.5rem 2.25rem;
    position: relative;
    overflow: hidden;
  }
  header.masthead::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      90deg,
      rgba(247,245,240,0.05) 0px,
      rgba(247,245,240,0.05) 1px,
      transparent 1px,
      transparent 64px
    );
    pointer-events: none;
  }
  .masthead-inner {
    max-width: 760px;
    margin: 0 auto;
    position: relative;
  }
  .eyebrow-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.6rem;
  }
  .pitch-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--pitch);
    flex-shrink: 0;
  }
  .season-label {
    font-size: 13px;
    color: rgba(247,245,240,0.68);
    letter-spacing: 0.02em;
  }
  h1.event-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    line-height: 0.98;
    margin: 0 0 0.35rem;
    color: var(--chalk);
  }
  .event-sub {
    font-size: 15px;
    color: rgba(247,245,240,0.72);
    margin: 0;
  }

  .controls-wrap {
    max-width: 760px;
    margin: -1.4rem auto 0;
    padding: 0 1.5rem;
    position: relative;
    z-index: 2;
  }
  .search-card {
    background: var(--card-bg);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(16,21,27,0.16);
    padding: 0.9rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .search-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.75rem;
  }
  .search-row svg {
    flex-shrink: 0;
    opacity: 0.45;
  }
  #teamSearch {
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--text-primary);
    width: 100%;
  }
  #teamSearch::placeholder { color: var(--text-muted); }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .chip {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { border-color: var(--turf-light); }
  .chip.active {
    background: var(--turf);
    border-color: var(--turf);
    color: var(--chalk);
  }

  main {
    max-width: 760px;
    margin: 2.25rem auto 0;
    padding: 0 1.5rem;
  }

  .date-heading {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin: 2rem 0 0.9rem;
  }
  .date-heading:first-child { margin-top: 0; }
  .date-heading h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin: 0;
    color: var(--text-primary);
  }
  .date-heading .count {
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .match-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.7rem;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.5rem 1rem;
  }

  .match-teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0.6rem;
  }
  .team-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 1.18rem;
    line-height: 1.15;
    color: var(--text-primary);
  }
  .team-name.home { text-align: right; }
  .team-name.away { text-align: left; }
  .team-block { display: flex; flex-direction: column; gap: 0.15rem; }
  .team-block.home-block { align-items: flex-end; }
  .team-block.away-block { align-items: flex-start; }
  .side-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .team-name.winner { color: var(--turf-light); }
  :root[data-theme="dark"] .team-name.winner,
  @media (prefers-color-scheme: dark) { .team-name.winner { color: var(--pitch); } }

  .score-block {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--score);
    min-width: 68px;
    justify-content: center;
  }
  .score-block .dash { color: var(--text-muted); font-weight: 500; font-size: 1.1rem; }
  .score-block.tbd {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    font-family: 'Inter', sans-serif;
  }

  .match-meta {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem 0.9rem;
    padding-top: 0.7rem;
    margin-top: 0.15rem;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--text-secondary);
  }
  .meta-item { display: flex; align-items: center; gap: 0.35rem; }
  .meta-item svg { opacity: 0.55; flex-shrink: 0; }

  .status-pill {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 0.18rem 0.55rem;
    border-radius: 20px;
    text-transform: capitalize;
  }
  .status-pill.scheduled { background: rgba(255,214,10,0.18); color: var(--turf-light); }
  @media (prefers-color-scheme: dark) { .status-pill.scheduled { color: var(--pitch); } }
  .status-pill.final { background: rgba(232,163,61,0.16); color: #A5680E; }
  @media (prefers-color-scheme: dark) { .status-pill.final { color: var(--score); } }

  .division-tag {
    margin-left: auto;
    font-size: 11.5px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .kit-pill {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 0.18rem 0.6rem;
    border-radius: 20px;
    white-space: nowrap;
  }
  .kit-pill.kit-white {
    background: #FFFFFF;
    color: var(--ink);
    border: 1px solid rgba(16,21,27,0.22);
  }
  .kit-pill.kit-red {
    background: #C0392B;
    color: #FFFFFF;
  }

  .meta-item.venue-link {
    cursor: pointer;
    color: var(--turf-light);
    text-decoration: underline;
    text-decoration-color: rgba(184,134,11,0.35);
    text-underline-offset: 2px;
    background: none;
    border: none;
    font: inherit;
    font-size: 12.5px;
    padding: 0;
  }
  .meta-item.venue-link:hover { text-decoration-color: currentColor; }

  .map-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(16,21,27,0.72);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .map-modal-overlay.open { display: flex; }
  .map-modal {
    background: var(--card-bg);
    border-radius: 12px;
    max-width: 560px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 1rem;
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  .map-modal img {
    width: 100%;
    border-radius: 8px;
    display: block;
  }
  .map-modal-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 1.2rem;
    margin: 0.2rem 0 0.75rem;
    color: var(--text-primary);
  }
  .map-modal-close {
    position: absolute;
    top: 0.6rem;
    right: 0.6rem;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--turf);
    color: var(--chalk);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty-state {
    text-align: center;
    padding: 3.5rem 1rem;
    color: var(--text-muted);
    font-size: 14px;
  }
  .empty-state svg { opacity: 0.35; margin-bottom: 0.75rem; }

  footer {
    max-width: 760px;
    margin: 2.5rem auto 0;
    padding: 1rem 1.5rem 0;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid var(--line);
    padding-top: 1rem;
  }

  @media (max-width: 480px) {
    .match-teams { grid-template-columns: 1fr auto 1fr; gap: 0.35rem; }
    .team-name { font-size: 1rem; }
    .score-block { font-size: 1.2rem; min-width: 52px; }
    .division-tag { margin-left: 0; width: 100%; order: 99; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="eyebrow-row">
      <span class="pitch-dot"></span>
      <span class="season-label">Fall 2026 Season</span>
    </div>
    <h1 class="event-title">The Hive — match schedule</h1>
    <p class="event-sub">Every fixture, result, and kickoff time in one place.</p>
  </div>
</header>

<div class="controls-wrap">
  <div class="search-card">
    <div class="search-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="teamSearch" placeholder="Search a team...">
    </div>
    <div class="chip-row" id="divisionChips"></div>
  </div>
</div>

<main id="scheduleRoot"></main>

<div class="map-modal-overlay" id="mapModalOverlay">
  <div class="map-modal">
    <button class="map-modal-close" id="mapModalClose" aria-label="Close">&times;</button>
    <div class="map-modal-title condensed" id="mapModalTitle">Venue Map</div>
    <img id="mapModalImg" src="" alt="Venue field map">
  </div>
</div>

<footer>
  Times shown as provided by the league. Tap a division chip to filter, or search for a team above.
</footer>

      homeScore: null,
      awayScore: null,
      status: "Scheduled",
      location: "Lindsey Park - 12",
      division: "ETPL"
    },
    {
      matchNum: 408,
      date: "2026-10-31",
      dateLabel: "Oct 31, 2026",
      time: "8:00 AM CDT",
      home: "The Hive",
      away: "East Texas United SC ETX Gil 13U G",
      homeScore: null,
      awayScore: null,
      status: "Scheduled",
      location: "Lindsey Park - 10",
      division: "ETPL"
    },
    {
      matchNum: 406,
      date: "2026-10-31",
      dateLabel: "Oct 31, 2026",
      time: "12:30 PM CDT",
      home: "Texas Sport Club Tejas FC",
      away: "The Hive",
      homeScore: null,
      awayScore: null,
      status: "Scheduled",
      location: "Lindsey Park - 12",
      division: "ETPL"
    },
    {
      matchNum: 413,
      date: "2026-11-14",
      dateLabel: "Nov 14, 2026",
      time: "3:30 PM CST",
      home: "Cumbre Alta Soccer Bossier City U13 Girls",
      away: "The Hive",
      homeScore: null,
      awayScore: null,
      status: "Scheduled",
      location: "Lindsey Park - 10",
      division: "ETPL"
    }
  ];

  const calendarIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>';
  const clockIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>';
  const pinIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>';

  let activeDivision = "all";
  let searchTerm = "";

  function getDivisions() {
    const set = new Set(MATCHES.map(m => m.division));
    return Array.from(set);
  }

  function renderChips() {
    const chipRow = document.getElementById('divisionChips');
    const divisions = getDivisions();
    let html = `<button class="chip ${activeDivision === 'all' ? 'active' : ''}" data-division="all">All divisions</button>`;
    divisions.forEach(d => {
      html += `<button class="chip ${activeDivision === d ? 'active' : ''}" data-division="${escapeAttr(d)}">${escapeHtml(d)}</button>`;
    });
    chipRow.innerHTML = html;
    chipRow.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        activeDivision = chip.getAttribute('data-division');
        renderChips();
        renderSchedule();
      });
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(str) { return escapeHtml(str); }

  function matchesFilter(m) {
    const inDivision = activeDivision === 'all' || m.division === activeDivision;
    const term = searchTerm.trim().toLowerCase();
    const inSearch = !term || m.home.toLowerCase().includes(term) || m.away.toLowerCase().includes(term);
    return inDivision && inSearch;
  }

  function renderSchedule() {
    const root = document.getElementById('scheduleRoot');
    const filtered = MATCHES.filter(matchesFilter);

    if (filtered.length === 0) {
      root.innerHTML = `
        <div class="empty-state">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <div>No matches found. Try a different team or division.</div>
        </div>`;
      return;
    }

    const byDate = {};
    filtered.forEach(m => {
      if (!byDate[m.date]) byDate[m.date] = { label: m.dateLabel, matches: [] };
      byDate[m.date].matches.push(m);
    });

    const sortedDates = Object.keys(byDate).sort();
    let html = '';

    sortedDates.forEach(dateKey => {
      const group = byDate[dateKey];
      html += `<div class="date-heading"><h2 class="condensed">${escapeHtml(group.label)}</h2><span class="count">${group.matches.length} match${group.matches.length === 1 ? '' : 'es'}</span></div>`;

      group.matches.forEach(m => {
        const hasScore = m.homeScore !== null && m.awayScore !== null;
        const homeWins = hasScore && m.homeScore > m.awayScore;
        const awayWins = hasScore && m.awayScore > m.homeScore;
        const statusClass = m.status.toLowerCase() === 'final' ? 'final' : 'scheduled';
        const hiveIsHome = m.home.trim() === 'The Hive';
        const hiveIsAway = m.away.trim() === 'The Hive';
        const kitPill = hiveIsHome
          ? '<span class="kit-pill kit-white">White Kit</span>'
          : hiveIsAway
            ? '<span class="kit-pill kit-red">Red Kit</span>'
            : '';

        html += `
        <div class="match-card">
          <div class="match-teams">
            <div class="team-block home-block">
              <span class="side-label">Home</span>
              <div class="team-name home ${homeWins ? 'winner' : ''}">${escapeHtml(m.home)}</div>
            </div>
            ${hasScore
              ? `<div class="score-block">${m.homeScore}<span class="dash">&ndash;</span>${m.awayScore}</div>`
              : `<div class="score-block tbd">${escapeHtml(m.time)}</div>`}
            <div class="team-block away-block">
              <span class="side-label">Away</span>
              <div class="team-name away ${awayWins ? 'winner' : ''}">${escapeHtml(m.away)}</div>
            </div>
          </div>
          <div class="match-meta">
            <span class="status-pill ${statusClass}">${escapeHtml(m.status)}</span>
            ${kitPill}
            <span class="meta-item">${clockIcon}${escapeHtml(m.time)}</span>
            ${isVenueMappable(m.location)
              ? `<button type="button" class="meta-item venue-link" data-venue="${escapeAttr(m.location)}">${pinIcon}${escapeHtml(m.location)}</button>`
              : `<span class="meta-item">${pinIcon}${escapeHtml(m.location)}</span>`}
            <span class="division-tag">#${m.matchNum} &middot; ${escapeHtml(m.division)}</span>
          </div>
        </div>`;
      });
    });

    root.innerHTML = html;

    root.querySelectorAll('.venue-link').forEach(btn => {
      btn.addEventListener('click', () => openMapModal(btn.getAttribute('data-venue')));
    });
  }

  function isVenueMappable(location) {
    const loc = location.trim().toLowerCase();
    return loc.startsWith('lindsey park') || loc.startsWith('beacon park');
  }

  function openMapModal(venueName) {
    const loc = venueName.trim().toLowerCase();
    const isBeacon = loc.startsWith('beacon park');
    document.getElementById('mapModalTitle').textContent = isBeacon ? 'Beacon Fields & Z-Plex — Ford Sports Village' : venueName;
    document.getElementById('mapModalImg').src = isBeacon ? BEACON_PARK_MAP : LINDSEY_PARK_MAP;
    document.getElementById('mapModalOverlay').classList.add('open');
  }
  function closeMapModal() {
    document.getElementById('mapModalOverlay').classList.remove('open');
  }
  document.getElementById('mapModalClose').addEventListener('click', closeMapModal);
  document.getElementById('mapModalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'mapModalOverlay') closeMapModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMapModal();
  });

  document.getElementById('teamSearch').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderSchedule();
  });

  renderChips();
  renderSchedule();
</script>
